<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --panel:#fff; --ink:#14213D; --muted:#6B7690; --line:#E1E6F0;
  --accent:#3B5BDB; --accent-soft:#E7ECFD; --done:#12A38A;
  --high:#E5484D; --med:#E39B1B; --low:#12A38A;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 12px 32px -12px rgba(20,33,61,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --panel:#161E33; --ink:#E8ECF7; --muted:#8C97B4; --line:#25304D;
    --accent:#7C93F5; --accent-soft:#232C4D; --done:#3CC9AE; --shadow:0 12px 32px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --panel:#161E33; --ink:#E8ECF7; --muted:#8C97B4; --line:#25304D;
  --accent:#7C93F5; --accent-soft:#232C4D; --done:#3CC9AE; --shadow:0 12px 32px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{min-height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;padding:clamp(16px,5vw,56px) 16px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{font-size:clamp(28px,6vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.date{color:var(--muted);font-size:14px;margin-top:4px}
.head-r{display:flex;align-items:center;gap:12px}
.ring{position:relative;width:60px;height:60px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--ink)}
.card{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.add{padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:16px}
.add input[type=text]{border:0;background:transparent;padding:10px 8px;font-size:17px;outline:none;min-width:0}
.add input::placeholder{color:var(--muted)}
.add .go{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 20px;font-weight:700;cursor:pointer}
.add .go:hover{filter:brightness(1.08)}
.opts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.opts select,.opts input[type=date]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;color:var(--muted)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 4px 12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.tabs button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.clear{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;font-weight:600}
.clear:hover{color:var(--high)}
ul{list-style:none;padding:0;overflow:hidden}
li{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);animation:in .2s ease}
li:last-child{border-bottom:0}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}
.chk{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;transition:.15s}
.chk:hover{border-color:var(--accent)}
.chk svg{opacity:0;transform:scale(.6);transition:.15s}
li.done .chk{background:var(--done);border-color:var(--done)}
li.done .chk svg{opacity:1;transform:none}
.body{flex:1;min-width:0}
.title{word-break:break-word;cursor:text}
li.done .title{color:var(--muted);text-decoration:line-through}
.meta{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.p-high{background:var(--high)}.p-medium{background:var(--med)}.p-low{background:var(--low)}
.overdue{color:var(--high);font-weight:700}
.edit{width:100%;border:0;border-bottom:2px solid var(--accent);background:none;padding:2px 0;outline:none}
.del{opacity:0;border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px}
li:hover .del,.del:focus-visible{opacity:1}
.del:hover{color:var(--high);background:var(--accent-soft)}
@media (hover:none){.del{opacity:1}}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1 id="greet">Today</h1>
      <p class="date" id="date"></p>
    </div>
    <div class="head-r">
      <div class="ring" aria-label="Progress">
        <svg width="60" height="60" viewBox="0 0 60 60"><circle class="bg" cx="30" cy="30" r="25"/><circle class="fg" id="arc" cx="30" cy="30" r="25" stroke-dasharray="157.1" stroke-dashoffset="157.1"/></svg>
        <span id="pct">0%</span>
      </div>
      <button class="icon-btn" id="theme" aria-label="Toggle theme" title="Toggle theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="add card">
    <input type="text" id="input" placeholder="Add a task" aria-label="Task name" maxlength="200" autocomplete="off">
    <button class="go" id="add">Add task</button>
    <div class="opts">
      <select id="prio" aria-label="Priority">
        <option value="low">Low priority</option>
        <option value="medium" selected>Medium priority</option>
        <option value="high">High priority</option>
      </select>
      <input type="date" id="due" aria-label="Due date">
    </div>
  </div>

  <div class="bar">
    <div class="tabs" role="group" aria-label="Filter tasks">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="active" aria-pressed="false">Active</button>
      <button data-f="done" aria-pressed="false">Completed</button>
    </div>
    <button class="clear" id="clear">Clear completed</button>
  </div>

  <ul class="card" id="list"></ul>
</main>

<script>
(function(){
  var KEY="tasks.v1", THEME="tasks.theme";
  var tasks=[], filter="all";
  var $=function(id){return document.getElementById(id)};
  var list=$("list"), input=$("input"), prio=$("prio"), due=$("due");

  function load(){try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){tasks=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function esc(s){return s.replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function today(){var d=new Date();d.setHours(0,0,0,0);return d}

  function fmtDue(s){
    var d=new Date(s+"T00:00:00"), t=today(), diff=Math.round((d-t)/864e5);
    if(diff===0)return["Due today",false]; if(diff===1)return["Due tomorrow",false];
    var txt=d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
    return diff<0?["Overdue · "+txt,true]:["Due "+txt,false];
  }

  function render(){
    var shown=tasks.filter(function(t){return filter==="all"||(filter==="done"?t.done:!t.done)});
    if(!shown.length){
      var msg={all:["No tasks yet","Type a task above and press Enter."],active:["Nothing left to do","Every task is complete."],done:["No completed tasks","Finished tasks will show up here."]}[filter];
      list.innerHTML='<li class="empty" style="display:block;animation:none"><b>'+msg[0]+'</b>'+msg[1]+'</li>';
    } else {
      list.innerHTML=shown.map(function(t){
        var m='<span><span class="dot p-'+t.prio+'"></span>'+t.prio[0].toUpperCase()+t.prio.slice(1)+'</span>';
        if(t.due&&!t.done){var f=fmtDue(t.due);m+='<span class="'+(f[1]?"overdue":"")+'">'+f[0]+'</span>'}
        else if(t.due){m+='<span>'+fmtDue(t.due)[0].replace("Overdue · ","")+'</span>'}
        return '<li data-id="'+t.id+'" class="'+(t.done?"done":"")+'">'+
          '<button class="chk" aria-label="'+(t.done?"Mark as active":"Mark as complete")+'" aria-pressed="'+t.done+'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button>'+
          '<div class="body"><div class="title" title="Double-click to edit">'+esc(t.text)+'</div><div class="meta">'+m+'</div></div>'+
          '<button class="del" aria-label="Delete task"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button></li>';
      }).join("");
    }
    var done=tasks.filter(function(t){return t.done}).length, p=tasks.length?Math.round(done/tasks.length*100):0;
    $("pct").textContent=p+"%";
    $("arc").style.strokeDashoffset=157.1*(1-p/100);
    $("clear").style.visibility=done?"visible":"hidden";
  }

  function add(){
    var text=input.value.trim(); if(!text){input.focus();return}
    tasks.unshift({id:uid(),text:text,done:false,prio:prio.value,due:due.value||""});
    input.value=""; due.value=""; save(); render(); input.focus();
  }

  function startEdit(li){
    var t=tasks.find(function(x){return x.id===li.dataset.id}), el=li.querySelector(".title");
    var inp=document.createElement("input"); inp.className="edit"; inp.value=t.text; inp.maxLength=200;
    el.replaceWith(inp); inp.focus(); inp.select();
    var finish=function(ok){ if(ok&&inp.value.trim())t.text=inp.value.trim(); save(); render(); };
    inp.addEventListener("keydown",function(e){if(e.key==="Enter")finish(true);if(e.key==="Escape")finish(false)});
    inp.addEventListener("blur",function(){finish(true)});
  }

  $("add").addEventListener("click",add);
  input.addEventListener("keydown",function(e){if(e.key==="Enter")add()});

  list.addEventListener("click",function(e){
    var li=e.target.closest("li[data-id]"); if(!li)return;
    var id=li.dataset.id;
    if(e.target.closest(".chk")){var t=tasks.find(function(x){return x.id===id});t.done=!t.done;save();render()}
    else if(e.target.closest(".del")){tasks=tasks.filter(function(x){return x.id!==id});save();render()}
  });
  list.addEventListener("dblclick",function(e){
    var li=e.target.closest("li[data-id]"); if(li&&e.target.closest(".title"))startEdit(li);
  });

  document.querySelectorAll(".tabs button").forEach(function(b){
    b.addEventListener("click",function(){
      filter=b.dataset.f;
      document.querySelectorAll(".tabs button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});
      render();
    });
  });
  $("clear").addEventListener("click",function(){tasks=tasks.filter(function(t){return !t.done});save();render()});

  $("theme").addEventListener("click",function(){
    var root=document.documentElement;
    var dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    root.dataset.theme=dark?"light":"dark";
    try{localStorage.setItem(THEME,root.dataset.theme)}catch(e){}
  });
  try{var th=localStorage.getItem(THEME);if(th)document.documentElement.dataset.theme=th}catch(e){}

  var h=new Date().getHours();
  $("greet").textContent=h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  $("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});

  load(); render();
})();
</script>
</body>
</html>
